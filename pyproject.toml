[project]
name = "cua-system"
version = "0.1.0"
description = "Computer-Use Automation System — LLM-driven discovery, deterministic replay, human-in-the-loop escalation"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}

dependencies = [
    "anthropic~=0.52",
    "playwright~=1.52",
    "pydantic~=2.11",
    "pydantic-settings~=2.9",
    "flask~=3.1",
    "typer~=0.15",
    "pyyaml~=6.0",
    "structlog~=25.4",
    "rich~=14.0",
]

[dependency-groups]
dev = [
    "pytest~=8.3",
    "pytest-asyncio~=1.0",
]

[project.scripts]
cua = "cua.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cua"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
