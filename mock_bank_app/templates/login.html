{% extends "base.html" %}
{% block content %}
<table width="400" border="0" cellpadding="8" cellspacing="0" align="center"
       style="margin-top: 80px; background: #FFFFFF; border: 1px solid #999999;">
<tr>
  <td colspan="2" bgcolor="#003366" style="padding: 12px;">
    <font color="#FFFFFF" size="3"><b>System Login</b></font>
  </td>
</tr>
{% if error %}
<tr>
  <td colspan="2">
    <table width="100%" border="0" bgcolor="#FFEEEE" style="border: 1px solid #CC0000;">
    <tr><td style="padding: 8px;"><font color="#CC0000" size="2">{{ error }}</font></td></tr>
    </table>
  </td>
</tr>
{% endif %}
<tr>
  <td colspan="2" style="padding: 16px;">
    <form method="POST" action="/login">
    <table border="0" cellpadding="4" cellspacing="0" width="100%">
    <tr>
      <td width="120"><font size="2">Username:</font></td>
      <td><input type="text" name="username" size="25" style="padding: 4px;"></td>
    </tr>
    <tr>
      <td><font size="2">Password:</font></td>
      <td><input type="password" name="password" size="25" style="padding: 4px;" value="demo"></td>
    </tr>
    <tr>
      <td>&nbsp;</td>
      <td style="padding-top: 12px;">
        <input type="submit" value="Sign In"
               style="padding: 6px 24px; background: #003366; color: white; border: 1px solid #002244; cursor: pointer;">
      </td>
    </tr>
    </table>
    </form>
  </td>
</tr>
</table>
{% endblock %}
